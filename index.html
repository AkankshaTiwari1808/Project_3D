  <script>
    const IMAGES = [
      {
        src: "https://fifth-gentle-45902158.figma.site/_components/v2/4de492f6d9cf8244ad5293233e5c6f52407d42fc/1.02464a56.png",
        bg: "#F4845F",
        panel: "#F79B7F"
      },
      {
        src: "https://fifth-gentle-45902158.figma.site/_components/v2/4de492f6d9cf8244ad5293233e5c6f52407d42fc/2.b977faab.png",
        bg: "#6BBF7A",
        panel: "#85CC92"
      },
      {
        src: "https://fifth-gentle-45902158.figma.site/_components/v2/4de492f6d9cf8244ad5293233e5c6f52407d42fc/3.4df853b4.png",
        bg: "#E882B4",
        panel: "#ED9DC4"
      },
      {
        src: "https://fifth-gentle-45902158.figma.site/_components/v2/4de492f6d9cf8244ad5293233e5c6f52407d42fc/4.4457fbce.png",
        bg: "#6EB5FF",
        panel: "#8DC4FF"
      }
    ];

    const hero = document.getElementById("hero");
    const carousel = document.getElementById("carousel");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");

    let activeIndex = 0;
    let isAnimating = false;
    let isMobile = window.innerWidth < 640;

    /*
     * Preload all four images on mount.
     */
    IMAGES.forEach((item) => {
      const image = new Image();
      image.src = item.src;
    });

    /*
     * Create the four carousel items.
     */
    IMAGES.forEach((item, index) => {
      const character = document.createElement("div");
      character.className = "character";
      character.dataset.index = index;

      const image = document.createElement("img");
      image.src = item.src;
      image.alt = "";
      image.draggable = false;

      character.appendChild(image);
      carousel.appendChild(character);
    });

    const characters = Array.from(
      document.querySelectorAll(".character")
    );

    function getRoles() {
      return {
        center: activeIndex,
        left: (activeIndex + 3) % 4,
        right: (activeIndex + 1) % 4,
        back: (activeIndex + 2) % 4
      };
    }

    function updateCarousel() {
      const roles = getRoles();

      hero.style.backgroundColor = IMAGES[activeIndex].bg;

      characters.forEach((character) => {
        const index = Number(character.dataset.index);

        character.classList.remove(
          "center",
          "left",
          "right",
          "back"
        );

        if (index === roles.center) {
          character.classList.add("center");
        } else if (index === roles.left) {
          character.classList.add("left");
        } else if (index === roles.right) {
          character.classList.add("right");
        } else if (index === roles.back) {
          character.classList.add("back");
        }
      });
    }

    function navigate(direction) {
      if (isAnimating) {
        return;
      }

      isAnimating = true;

      if (direction === "next") {
        activeIndex = (activeIndex + 1) % 4;
      } else {
        activeIndex = (activeIndex + 3) % 4;
      }

      updateCarousel();

      window.setTimeout(() => {
        isAnimating = false;
      }, 650);
    }

    prevButton.addEventListener("click", () => {
      navigate("prev");
    });

    nextButton.addEventListener("click", () => {
      navigate("next");
    });

    function updateMobileState() {
      isMobile = window.innerWidth < 640;

      /*
       * Re-apply the active role classes so the responsive CSS
       * immediately takes effect after a resize.
       */
      updateCarousel();
    }

    window.addEventListener("resize", updateMobileState);

    /*
     * Optional keyboard navigation mirrors the carousel controls.
     */
    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        navigate("prev");
      } else if (event.key === "ArrowRight") {
        navigate("next");
      }
    });

    /*
     * Initial render.
     */
    updateCarousel();
  </script>
</body>
